<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ocean Surf Camp: Catch your first wave</title>
  <meta name="description" content="A one-week surf camp for people who have never stood on a board. Board and wetsuit included, 6 people per group.">
  <meta name="theme-color" content="#04303d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/bg.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
  <script>
    document.documentElement.classList.add('js');
    // safety net: never leave the copy hidden if the main script fails
    setTimeout(function () { var h = document.querySelector('.hero'); if (h) h.classList.add('is-go'); }, 4000);
  </script>
</head>
<body>
  <section class="hero is-pre" id="top" aria-labelledby="hero-title">
    <!-- Background layers. Shown as plain images when WebGL is not available; with WebGL they are drawn on the canvas. -->
    <div class="hero__media" aria-hidden="true">
      <img class="hero__photo" src="assets/bg.jpg" alt="">
      <canvas class="hero__canvas" id="gl"></canvas>
      <div class="hero__shade"></div>
    </div>

    <header class="header">
      <div class="container header__inner">
        <a class="logo" href="#top" data-in style="--d:.05s;--y:-14px"><span>Ocean</span><span>surf camp</span></a>

        <nav class="nav" id="nav" aria-label="Main">
          <ul class="nav__list">
            <li data-in style="--d:.12s;--y:-14px"><a href="#program"><span class="roll"><span data-t="Program">Program</span></span><svg class="squig" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 5 Q 6.25 0 12.5 5 T 25 5 T 37.5 5 T 50 5 T 62.5 5 T 75 5 T 87.5 5 T 100 5"/></svg></a></li>
            <li data-in style="--d:.18s;--y:-14px"><a href="#stay"><span class="roll"><span data-t="Stay">Stay</span></span><svg class="squig" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 5 Q 12.5 0 25 5 T 50 5 T 75 5 T 100 5"/></svg></a></li>
            <li data-in style="--d:.24s;--y:-14px"><a href="#location"><span class="roll"><span data-t="Location">Location</span></span><svg class="squig" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 5 Q 6.25 0 12.5 5 T 25 5 T 37.5 5 T 50 5 T 62.5 5 T 75 5 T 87.5 5 T 100 5"/></svg></a></li>
            <li data-in style="--d:.30s;--y:-14px"><a href="#faq"><span class="roll"><span data-t="FAQ">FAQ</span></span><svg class="squig" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 5 Q 16.6 0 33.3 5 T 66.6 5 T 100 5"/></svg></a></li>
          </ul>
        </nav>

        <div class="header__actions" data-in style="--d:.36s;--y:-14px">
          <a class="btn btn--book" href="#book">
            <img class="btn__bg" src="assets/btn-book.png" alt="">
            <span class="btn__label roll"><span data-t="Book now">Book now</span></span>
          </a>
          <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav">
            <span class="menu-toggle__label">Menu</span>
            <span class="menu-toggle__icon" aria-hidden="true"><i></i><i></i></span>
          </button>
        </div>
      </div>
    </header>

    <div class="container hero__main">
      <h1 class="headline" id="hero-title">
        <span class="visually-hidden">Catch your first wave</span>
        <img class="headline__word headline__word--catch" data-word="catch" src="assets/catch.png" alt="" width="969" height="143" aria-hidden="true">
        <span class="headline__line">
          <img class="headline__word headline__word--first" data-word="first" src="assets/first.png" alt="" width="805" height="225" aria-hidden="true">
          <img class="headline__word headline__word--wave" data-word="wave" src="assets/wave.png" alt="" width="817" height="225" aria-hidden="true">
        </span>
      </h1>

      <p class="sub">
        <span data-in style="--d:.55s">A one-week surf camp</span>
        <span data-in style="--d:.65s">for people who have never</span>
        <span data-in style="--d:.75s">stood on a board</span>
      </p>
    </div>

    <div class="container hero__foot">
      <div class="actions">
        <a class="btn btn--primary" href="#book" data-in style="--d:.95s">
          <img class="btn__bg" src="assets/btn-primary.png" alt="">
          <span class="btn__label roll"><span data-t="Book your camp">Book your camp</span></span>
        </a>
        <a class="btn btn--outline" href="#program" data-in style="--d:1.05s">
          <img class="btn__bg" src="assets/btn-outline.png" alt="">
          <span class="btn__label roll"><span data-t="See the program">See the program</span></span>
        </a>
      </div>
      <ul class="facts facts--left" data-in style="--d:1.2s">
        <li>No experience needed</li>
        <li>Board and wetsuit included</li>
      </ul>
      <ul class="facts facts--right" data-in style="--d:1.25s">
        <li>6 people per group</li>
        <li>Instructor by your side</li>
      </ul>
    </div>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
